services:
  gbox-image-cache-fix:
    container_name: gbox-image-cache-fix
    image: bossjun/gbox-image-cache-fix:1.1.1
    restart: unless-stopped
    environment:
      TARGET_NAME: "g-box"                 # 小雅主容器名（bill 版一般为 g-box）
      TARGET_IMAGE_MATCH: "ailg/g-box"     # 容器名变了时的兜底匹配（按镜像名）
      MAX_WIDTH: "800"                     # 图片 maxWidth 上限：详情页大图压到此宽度；小图与原图不受影响
      ENABLE_IMAGE_CAP: "true"             # 设为 false 可关闭压缩，只保留缓存策略修正
      INTERVAL: "20"                       # 巡检间隔（秒）
      TZ: "Asia/Shanghai"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
